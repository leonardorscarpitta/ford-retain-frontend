# Local development: `make dev`, then open http://localhost:3000.
# Needs the API from ford-retain-backend running (`make dev` there first):
# this joins its `ford-retain` network and calls it as http://backend:8080.
services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      API_URL: "http://backend:8080"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
    ports:
      - "3000:3000"

networks:
  default:
    name: ford-retain
    external: true
