# Exposed through K3s's bundled Traefik on the VM's ports 80/443. No host is
# set, so it answers on the VM's IP; add `host:` (and a TLS secret) once there's
# a domain. Use HTTPS: the session cookie is `Secure` in production.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ford-retain-frontend
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ford-retain-frontend
                port:
                  name: http
